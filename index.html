    <script>
      // Polyfill window.fetch with both getter and setter so injected extensions don't throw TypeError
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}
      })();
    </script>
